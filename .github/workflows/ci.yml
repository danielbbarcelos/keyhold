name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the interface
        working-directory: web
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release

      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: |
          SKIP_BUILD=1 ./install.sh
          plutil -lint ~/Applications/Keyhold.app/Contents/Info.plist
          test -x ~/Applications/Keyhold.app/Contents/MacOS/Keyhold
          ~/.local/bin/keyhold --version

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -SkipBuild
          & "$env:LOCALAPPDATA\Programs\Keyhold\keyhold.exe" --version
          if (-not (Test-Path 'HKCU:\Software\Classes\keyhold\shell\open\command')) { throw 'keyhold:// not registered' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Keyhold.lnk'))) { throw 'no Start menu entry' }
