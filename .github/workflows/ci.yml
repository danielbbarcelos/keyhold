name: CI

on:
  push:
  pull_request:

# Tests need to read the code and nothing else.
permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the interface
        working-directory: web
        run: npm ci --ignore-scripts && npm run build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master
        with: { toolchain: stable }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Tests
        run: cargo test --release

      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: |
          SKIP_BUILD=1 ./install.sh
          plutil -lint ~/Applications/Keyhold.app/Contents/Info.plist
          test -x ~/Applications/Keyhold.app/Contents/MacOS/Keyhold
          ~/.local/bin/keyhold --version

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -SkipBuild
          & "$env:LOCALAPPDATA\Programs\Keyhold\keyhold.exe" --version
          if (-not (Test-Path 'HKCU:\Software\Classes\keyhold\shell\open\command')) { throw 'keyhold:// not registered' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Keyhold.lnk'))) { throw 'no Start menu entry' }
