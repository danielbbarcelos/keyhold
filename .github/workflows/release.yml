name: Release

# Every release builds its downloads by itself: pushing a tag v* (or publishing a release on
# GitHub) builds the Windows installer, the macOS app and the Linux package and attaches them.
# When the release does not exist yet it is created and published, with that version's section
# of CHANGELOG.md as its notes. Run by hand, it only builds, so the packages can be checked first.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

# A tag pushed together with a release made on GitHub would start this twice; one is enough.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The build jobs run other people's code (actions, npm, cargo, Chocolatey), so they only read.
# Writing to releases belongs to `publish` alone.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Interface
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master
        with: { toolchain: stable }
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/keyhold/assets
          cp target/release/keyhold install.sh dist/keyhold/
          cp assets/icon.png dist/keyhold/assets/
          tar -C dist -czf keyhold-linux-x64.tar.gz keyhold
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: linux, path: keyhold-linux-x64.tar.gz }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Interface
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master
        with: { toolchain: stable, targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output keyhold \
            target/aarch64-apple-darwin/release/keyhold \
            target/x86_64-apple-darwin/release/keyhold
      - name: Package
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          packaging/macos/make-app.sh keyhold "$VERSION" dist
          ditto -c -k --keepParent dist/Keyhold.app keyhold-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: macos, path: keyhold-macos.zip }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Interface
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master
        with: { toolchain: stable }
      - name: Build
        run: cargo build --release --locked
      - name: Nothing a clean Windows lacks
        shell: pwsh
        run: |
          # This machine has the Visual C++ runtime; a person's may not. The executables must not
          # ask for it (see .cargo/config.toml), or Keyhold installs and then fails to start.
          foreach ($exe in 'keyhold.exe', 'keyhold-launch.exe') {
            $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes("target\release\$exe"))
            foreach ($dll in 'VCRUNTIME140', 'MSVCP140', 'api-ms-win-crt') {
              if ($text.IndexOf($dll, [StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "$exe needs $dll" }
            }
          }
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$version" packaging\windows\keyhold.iss
          if ($LASTEXITCODE -ne 0) { throw 'the installer did not build' }
          Copy-Item dist\KeyholdSetup.exe KeyholdSetup.exe
      - name: Install it, the way a person would (silently here)
        shell: pwsh
        run: |
          Start-Process .\KeyholdSetup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Keyhold"
          if (-not (Test-Path "$app\keyhold.exe")) { throw 'keyhold.exe not installed' }
          if (-not (Test-Path "$app\keyhold-launch.exe")) { throw 'the launcher is missing' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Keyhold.lnk'))) { throw 'no Start menu entry' }
          if (-not (Test-Path 'HKCU:\Software\Classes\keyhold\shell\open\command')) { throw 'keyhold:// not registered' }
          & "$app\keyhold.exe" --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: windows, path: KeyholdSetup.exe }

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: out, merge-multiple: true }
      # A signed statement that these exact files came out of this workflow at this commit:
      #   gh attestation verify KeyholdSetup.exe --repo danielbbarcelos/keyhold
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with: { subject-path: 'out/*' }
      - name: Attach to the release, making it when there is none
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          # The notes are that version's section of the changelog, heading excluded.
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Keyhold $VERSION" > notes.md
          # What each download should hash to, for anyone who wants to check before running it.
          (cd out && sha256sum * > SHA256SUMS.txt)
          { echo; echo '### SHA-256'; echo; echo '```'; cat out/SHA256SUMS.txt; echo '```'; } >> notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "Keyhold $VERSION" --notes-file notes.md --latest
          fi
