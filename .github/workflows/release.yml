name: Release

# A tag v* builds Keyhold for Windows, macOS and Linux and attaches the downloads to that tag's
# release (made as a draft when it does not exist yet). Run by hand, it only builds, so the
# packages can be checked first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Interface
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/keyhold/assets
          cp target/release/keyhold install.sh dist/keyhold/
          cp assets/icon.png dist/keyhold/assets/
          tar -C dist -czf keyhold-linux-x64.tar.gz keyhold
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: keyhold-linux-x64.tar.gz }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Interface
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output keyhold \
            target/aarch64-apple-darwin/release/keyhold \
            target/x86_64-apple-darwin/release/keyhold
      - name: Package
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          packaging/macos/make-app.sh keyhold "$VERSION" dist
          ditto -c -k --keepParent dist/Keyhold.app keyhold-macos.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: keyhold-macos.zip }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Interface
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Keyhold\assets | Out-Null
          Copy-Item target\release\keyhold.exe, install.ps1 dist\Keyhold\
          Copy-Item 'packaging\windows\Instalar Keyhold.cmd' dist\Keyhold\
          Copy-Item assets\icon.png dist\Keyhold\assets\
          Compress-Archive -Path dist\Keyhold -DestinationPath keyhold-windows-x64.zip
      - name: Installer from the package
        shell: pwsh
        run: |
          Expand-Archive keyhold-windows-x64.zip -DestinationPath check
          powershell -ExecutionPolicy Bypass -File check\Keyhold\install.ps1
          & "$env:LOCALAPPDATA\Programs\Keyhold\keyhold.exe" --version
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: keyhold-windows-x64.zip }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Keyhold ${TAG#v}" --notes "Keyhold ${TAG#v}"
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
