[package]
name = "keyhold"
version = "1.0.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "A strictly local password vault. Nothing leaves the machine."
readme = "README.md"
keywords = ["password-manager", "vault", "local-first", "mcp"]
categories = ["command-line-utilities"]
repository = "https://github.com/danielbbarcelos/keyhold"
homepage = "https://github.com/danielbbarcelos/keyhold"

[dependencies]
axum = "0.7"
# HTTPS when `set-host` made a certificate (mkcert). ring rather than aws-lc: no C toolchain beyond
# what the rest already needs.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "process"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rust-embed = "8"
mime_guess = "2"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
argon2 = "0.5"
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
thiserror = "1"
anyhow = "1"
# Only for the AWS Parameter Store vaults (src/aws): the one place Keyhold talks to a network,
# and only when somebody has configured such a vault. rustls on the `ring` provider, so no C
# toolchain, no aws-lc and no OpenSSL; the roots are compiled in rather than read from the system.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Processes and signals: who is on the agent socket, whether another Keyhold is running, and
# asking it to show itself or close.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The same on Windows, where processes, their owners and the agent's named pipe are Win32 calls.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Wdk_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[profile.release]
# A panic mid-unwind can drop key material in an order zeroization does not cover.
# Aborting keeps that window from existing at all.
panic = "abort"
strip = true
lto = true
